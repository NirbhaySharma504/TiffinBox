spring.application.name=order-service
server.port=8085

# --- Eureka client ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- Datasource: orderdb (Docker postgres:16) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=tiffinbox
spring.datasource.password=tiffinbox
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Feign + circuit breaker (Resilience4j) ---
spring.cloud.openfeign.circuitbreaker.enabled=true
# Fast-fail Feign calls so a slow dependency can't hang order placement.
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# --- Resilience4j circuit breaker defaults ---
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.menu-service.base-config=default
resilience4j.circuitbreaker.instances.payment-service.base-config=default

# --- Kafka producer (publishes order-placed) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
order.kafka.order-events-topic=order-events
