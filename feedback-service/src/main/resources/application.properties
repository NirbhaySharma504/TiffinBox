spring.application.name=feedback-service
server.port=8087

# --- Eureka client ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- Datasource: feedbackdb (Docker postgres:16) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/feedbackdb
spring.datasource.username=tiffinbox
spring.datasource.password=tiffinbox
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Spring AI -> Groq (OpenAI-compatible endpoint). Key from GROQ_API_KEY env. ---
spring.ai.openai.api-key=${GROQ_API_KEY:not-set}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.0
# We only use chat, not embeddings — don't autoconfigure an embedding model.
spring.ai.model.embedding=none

# Toggle real AI calls. When false (or on error/missing key) a keyword fallback is used.
feedback.ai.enabled=${FEEDBACK_AI_ENABLED:true}
