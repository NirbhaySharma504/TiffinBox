spring.application.name=user-service
server.port=8081

# --- Eureka client ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- Datasource: userdb (Docker postgres:16) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/userdb
spring.datasource.username=tiffinbox
spring.datasource.password=tiffinbox
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Owner (admin) seed: created on startup only if no OWNER exists. Override via env. ---
owner.seed.name=${OWNER_NAME:Tiffin Owner}
owner.seed.email=${OWNER_EMAIL:owner@tiffinbox.com}
owner.seed.password=${OWNER_PASSWORD:owner123}

# --- JWT ---
# HS256 secret (>=256 bits). MUST match the secret the API Gateway uses to validate (Phase 4).
jwt.secret=TiffinBoxSuperSecretKeyForJwtSigning_ChangeMe_AtLeast32Bytes!!
jwt.expiration-ms=86400000

