spring.application.name=api-gateway
server.port=8080

# --- JWT validation (must match the secret user-service signs with) ---
jwt.secret=${JWT_SECRET:TiffinBoxSuperSecretKeyForJwtSigning_ChangeMe_AtLeast32Bytes!!}

# --- Eureka client: find services by name, no hardcoded URLs ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- Spring Cloud Gateway routes (reactive / webflux) ---
# Path-based routing. Each downstream is resolved through Eureka via lb://<SERVICE-ID>.
# Paths are passed through unchanged (no StripPrefix); each service owns its /api/* paths.

# user-service: auth (register/login) + user/address management
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

# menu-service
spring.cloud.gateway.server.webflux.routes[1].id=menu-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MENU-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/menu/**

# order-service
spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**

# payment-service
spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/payments/**

# notification-service
spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notifications/**

# subscription-service
spring.cloud.gateway.server.webflux.routes[5].id=subscription-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://SUBSCRIPTION-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/subscriptions/**
