spring.application.name=notification-service
server.port=8084

# --- Eureka client ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- Datasource: notifdb (Docker postgres:16) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/notifdb
spring.datasource.username=tiffinbox
spring.datasource.password=tiffinbox
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Kafka consumer (order-events) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
notification.kafka.order-events-topic=order-events

# --- Email (Gmail SMTP). Secrets come from env vars, never committed. ---
# Real sending is OFF by default; flip to true and export MAIL_USERNAME / MAIL_PASSWORD
# (a Gmail App Password) to send actual emails. When false, emails are logged (mock).
notification.mail.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
