spring.application.name=subscription-service
server.port=8086

# --- Eureka client ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- Datasource: subscriptiondb (Docker postgres:16) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/subscriptiondb
spring.datasource.username=tiffinbox
spring.datasource.password=tiffinbox
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Feign + circuit breaker (Resilience4j) ---
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# --- Auto-order scheduler: runs daily (default 08:00). Cron is overridable. ---
subscription.scheduler.cron=0 0 8 * * *
