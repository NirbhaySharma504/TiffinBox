spring.application.name=menu-service
server.port=8082

# --- Eureka client ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- Datasource: menudb (Docker postgres:16) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/menudb
spring.datasource.username=tiffinbox
spring.datasource.password=tiffinbox
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Menu ordering cutoff scheduler (how often we check, ms) ---
menu.cutoff.check-interval-ms=60000
