# TiffinBox — full stack. `docker compose up --build` brings up infra + all services + frontend.
# Reads secrets from .env (see .env.example). Service-to-service discovery is via Eureka;
# Spring relaxed binding maps the *_* env vars below onto application.properties keys.

services:
  # ---------------- Infrastructure ----------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiffinbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiffinbox}
      POSTGRES_DB: tiffinbox
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiffinbox}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tiffinbox]

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [tiffinbox]

  # ---------------- Discovery + edge ----------------
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks: [tiffinbox]

  api-gateway:
    build: ./api-gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      eureka-server:
        condition: service_started
    ports:
      - "8080:8080"
    networks: [tiffinbox]

  # ---------------- Services ----------------
  user-service:
    build: ./user-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tiffinbox}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tiffinbox}
      JWT_SECRET: ${JWT_SECRET}
      OWNER_NAME: ${OWNER_NAME:-Tiffin Owner}
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@tiffinbox.com}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-owner123}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [tiffinbox]

  menu-service:
    build: ./menu-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/menudb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tiffinbox}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tiffinbox}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [tiffinbox]

  payment-service:
    build: ./payment-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tiffinbox}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tiffinbox}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [tiffinbox]

  notification-service:
    build: ./notification-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tiffinbox}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tiffinbox}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_MAIL_ENABLED: ${NOTIFICATION_MAIL_ENABLED:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [tiffinbox]

  order-service:
    build: ./order-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tiffinbox}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tiffinbox}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [tiffinbox]

  subscription-service:
    build: ./subscription-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/subscriptiondb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tiffinbox}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tiffinbox}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [tiffinbox]

  feedback-service:
    build: ./feedback-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/feedbackdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tiffinbox}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tiffinbox}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FEEDBACK_AI_ENABLED: ${FEEDBACK_AI_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [tiffinbox]

  # ---------------- Frontend ----------------
  frontend:
    build:
      context: ./frontend
      args:
        # Browser runs on the host, so it reaches the gateway via the published port.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - api-gateway
    ports:
      - "5173:80"
    networks: [tiffinbox]

volumes:
  pgdata:
  kafkadata:

networks:
  tiffinbox:
    driver: bridge
